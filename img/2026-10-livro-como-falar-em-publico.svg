<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif">
<rect width="1080" height="1350" fill="#F4F3FB"/><rect width="1080" height="14" fill="#5B3FD1"/>
<text x="84" y="108" font-size="28" font-weight="700" fill="#5B3FD1" letter-spacing="4">AUDIOBOOK DA SEMANA</text>
<text x="84" y="200" font-size="66" font-weight="700" fill="#1F2A37">Como Falar em Público</text><text x="84" y="282" font-size="66" font-weight="700" fill="#1F2A37">e Encantar Pessoas</text>
<text x="84" y="345" font-size="30" fill="#6B7280">Dale Carnegie · 5 partes, 4 ideias para praticar</text>
<rect x="84" y="380" width="120" height="6" rx="3" fill="#5B3FD1"/>
<text x="84" y="450" font-size="36" font-weight="700" fill="#5B3FD1">4 ideias para praticar</text>
<rect x="84" y="485" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#DDD8F3" stroke-width="3"/><circle cx="150" cy="560" r="34" fill="#5B3FD1"/><text x="150" y="573" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="215" y="553" font-size="33" font-weight="700" fill="#1F2A37">Coragem vem da prática.</text><text x="215" y="597" font-size="28" fill="#6B7280">Quanto mais você fala, menos o medo pesa.</text>
<rect x="84" y="655" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#DDD8F3" stroke-width="3"/><circle cx="150" cy="730" r="34" fill="#5B3FD1"/><text x="150" y="743" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="215" y="723" font-size="33" font-weight="700" fill="#1F2A37">Prepare as ideias, não as palavras.</text><text x="215" y="767" font-size="28" fill="#6B7280">Conte histórias reais e ensaie em voz alta.</text>
<rect x="84" y="825" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#DDD8F3" stroke-width="3"/><circle cx="150" cy="900" r="34" fill="#5B3FD1"/><text x="150" y="913" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="215" y="893" font-size="33" font-weight="700" fill="#1F2A37">Abra com impacto, feche com ação.</text><text x="215" y="937" font-size="28" fill="#6B7280">Uma história ou pergunta prende a atenção.</text>
<rect x="84" y="995" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#DDD8F3" stroke-width="3"/><circle cx="150" cy="1070" r="34" fill="#5B3FD1"/><text x="150" y="1083" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="215" y="1063" font-size="33" font-weight="700" fill="#1F2A37">Fale com as pessoas.</text><text x="215" y="1107" font-size="28" fill="#6B7280">Entusiasmo e sinceridade valem mais que técnica.</text>
<text x="84" y="1275" font-size="27" fill="#6B7280">Anotações de estudo · audiobook da semana</text><text x="996" y="1275" font-size="28" font-weight="700" fill="#5B3FD1" text-anchor="end">@alexpernaoficial</text></svg>