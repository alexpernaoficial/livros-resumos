<text x="84" y="108" font-size="28" font-weight="700" fill="#0F766E" letter-spacing="4">AUDIOBOOK DA SEMANA</text>
<text x="84" y="200" font-size="68" font-weight="700" fill="#1F2A37">Como Ser um Grande</text><text x="84" y="282" font-size="68" font-weight="700" fill="#1F2A37">Líder e Influenciar</text><text x="84" y="364" font-size="68" font-weight="700" fill="#1F2A37">Pessoas</text>
<text x="84" y="425" font-size="30" fill="#6B7280">Dale Carnegie · 6 temas, 4 para praticar primeiro</text>
<rect x="84" y="460" width="120" height="6" rx="3" fill="#0F766E"/>
<text x="84" y="530" font-size="36" font-weight="700" fill="#0F766E">4 ideias para praticar</text>
<rect x="84" y="565" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#D5E6E3" stroke-width="3"/><circle cx="150" cy="640" r="34" fill="#0F766E"/><text x="150" y="653" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="215" y="633" font-size="34" font-weight="700" fill="#1F2A37">Elogie de forma específica.</text><text x="215" y="677" font-size="29" fill="#6B7280">Diga o que a pessoa fez bem.</text>
<rect x="84" y="735" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#D5E6E3" stroke-width="3"/><circle cx="150" cy="810" r="34" fill="#0F766E"/><text x="150" y="823" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="215" y="803" font-size="34" font-weight="700" fill="#1F2A37">Pergunte antes de mandar.</text><text x="215" y="847" font-size="29" fill="#6B7280">Quem decide junto se compromete.</text>
<rect x="84" y="905" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#D5E6E3" stroke-width="3"/><circle cx="150" cy="980" r="34" fill="#0F766E"/><text x="150" y="993" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="215" y="973" font-size="34" font-weight="700" fill="#1F2A37">Corrija em particular.</text><text x="215" y="1017" font-size="29" fill="#6B7280">Nunca em público, sempre com respeito.</text>
<rect x="84" y="1075" width="912" height="150" rx="22" fill="#FFFFFF" stroke="#D5E6E3" stroke-width="3"/><circle cx="150" cy="1150" r="34" fill="#0F766E"/><text x="150" y="1163" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="215" y="1143" font-size="34" font-weight="700" fill="#1F2A37">Dê o exemplo.</text><text x="215" y="1187" font-size="29" fill="#6B7280">O time copia o que o líder faz.</text>
